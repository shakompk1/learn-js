<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#12160C"><title>Гильдия · ответы</title><style>
*{box-sizing:border-box}body{margin:0;background:#12160c;color:#f4f8ea;font:18px/1.5 system-ui,sans-serif;min-height:100dvh;padding:24px 24px 110px}main{max-width:700px;margin:auto}.brand{color:#c5f82a;letter-spacing:2px;font-size:13px;font-weight:800}h1{font-size:34px;line-height:1.2;margin:20px 0}h2{font-size:25px;line-height:1.4}.panel{border:1px solid #40532a;border-radius:20px;padding:22px;margin:25px 0;background:#1a2312}input{font:700 30px monospace;letter-spacing:5px;background:#f4f8ea;color:#12160c;border-radius:12px;border:0;padding:16px;width:100%;margin:15px 0}button{background:#c5f82a;color:#12160c;font:800 19px system-ui;border:0;border-radius:13px;min-height:58px;padding:15px 20px;cursor:pointer;width:100%}button:disabled{opacity:.5;cursor:default}button:focus-visible,input:focus-visible{outline:3px solid #8ab5ff;outline-offset:4px}.options{display:grid;grid-template-columns:1fr;gap:13px}.options button{text-align:left;background:#26371b;color:#f4f8ea;display:flex;gap:17px;border:2px solid #425832;font-weight:600}.options b{color:#c5f82a;font-size:23px}.options .selected{border-color:#c5f82a}.options .correct{background:#c5f82a;color:#12160c}.options .correct b{color:#12160c}.options .wrong{border-color:#f1a08a;background:#4c281f}pre{font:14px/1.6 monospace;white-space:pre-wrap;overflow-wrap:anywhere;background:#0b1107;padding:18px;border-radius:12px}small,.muted{color:#aebf9c}.top{display:flex;justify-content:space-between;gap:12px;margin-top:25px}.time{font:700 32px monospace;color:#c5f82a}.error{color:#ffb39b;min-height:28px}.status{color:#d5f39a;min-height:28px}.badge{background:#2b401c;padding:8px 15px;border-radius:30px;font-size:15px}#question-view[hidden],#lobby[hidden],#join-view[hidden]{display:none}@media(prefers-reduced-motion:no-preference){.panel{animation:in .35s ease}@keyframes in{from{opacity:0;transform:translateY(10px)}}}
main>small:last-child{display:block;padding-left:70px}</style></head><body><main><div class="brand">JAVASCRIPT / ГИЛЬДИЯ ГЕРОЕВ</div><section id="join-view"><h1>Вступайте в гильдию 📱</h1><p>Введите код с экрана преподавателя.</p><form class="panel" id="join-form"><label for="room">Код комнаты</label><input id="room" name="room" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="off" required aria-describedby="room-note"><small id="room-note">После ввода имени вы получите место в комнате.</small><button style="margin-top:20px" type="submit">Присоединиться →</button><p class="error" id="join-error" role="alert"></p></form></section><section id="lobby" hidden><div class="top"><span class="badge" id="identity"></span><span class="badge" id="room-label"></span></div><div class="panel"><h1>Вы в команде 🛡️</h1><p id="lobby-message">Ждём, когда преподаватель запустит квиз.</p></div></section><section id="question-view" hidden><div class="top"><span class="badge" id="quiz-number"></span><span class="time" id="time">25</span></div><h2 id="question"></h2><pre id="code" hidden></pre><div class="options" id="options"></div><p class="status" id="vote-status" aria-live="polite"></p><p id="why"></p></section><p class="error" id="connection" role="status"></p><small>Один ответ на раунд. Можно закрыть и снова открыть эту вкладку. Ответы хранятся до 6 часов.</small></main><script src="/identity.js"></script><script src="/leaderboard.js"></script><script>
(()=>{const $=s=>document.querySelector(s);let session=null,state=null,offset=0,pending=false;const room=new URLSearchParams(location.search).get('room')||'';$('#room').value=room.replace(/\D/g,'').slice(0,6);try{session=JSON.parse(localStorage.getItem('guild-player-'+room)||'null');}catch{}
const api=async(action,data={})=>{const r=await fetch('/api/classroom',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...session,...data})});const x=await r.json();if(!r.ok){const e=Error(x.error);e.status=r.status;throw e;}return x;};
function joined(){$('#join-view').hidden=true;$('#lobby').hidden=false;$('#identity').textContent=session.name;$('#room-label').textContent='Комната '+session.room;}
function render(s){const fresh=!state||state.round!==s.round;offset=s.serverNow-Date.now();state=s;if(s.phase==='ended'){$('#lobby').hidden=false;$('#question-view').hidden=true;window.renderClassroomLeaderboard($('#lobby .panel'),s.leaderboard||[],session.name);return;}if(!s.question){$('#lobby').hidden=false;$('#question-view').hidden=true;return;}$('#lobby').hidden=true;$('#question-view').hidden=false;$('#quiz-number').textContent=(s.question.kind==='card'?'Карточка ':'Квиз ')+(s.question.number||s.quiz+1)+' / 6 · '+session.name;$('#question').textContent=s.question.question;$('#code').hidden=!s.question.code;$('#code').textContent=s.question.code||'';if(fresh){$('#options').innerHTML='';s.question.options.forEach((text,i)=>{const b=document.createElement('button');const letter=document.createElement('b');letter.textContent='ABCD'[i];const label=document.createElement('span');label.textContent=text;b.append(letter,label);b.onclick=()=>submit(i);$('#options').append(b);});}const open=s.phase==='open'&&Date.now()+offset<s.deadline;[...$('#options').children].forEach((b,i)=>{b.disabled=!open||s.own!==null||pending;b.classList.toggle('selected',s.own===i);b.classList.toggle('correct',s.phase==='revealed'&&s.question.correct===i);b.classList.toggle('wrong',s.phase==='revealed'&&s.own===i&&s.question.correct!==i);});$('#vote-status').textContent=s.own!==null?'Ответ '+ 'ABCD'[s.own] +' принят ✓':open?'Выберите один вариант.':'Голосование закрыто. Ждём разбор.';$('#why').textContent=s.phase==='revealed'?s.question.why:'';drawTime();}
async function refresh(){if(!session)return;try{render(await api('status'));$('#connection').textContent='';}catch(e){$('#connection').textContent=e.message;if([403,404].includes(e.status)){$('#join-view').hidden=false;$('#lobby').hidden=true;$('#question-view').hidden=true;localStorage.removeItem('guild-player-'+session.room);session=null;}}}
async function submit(choice){if(pending||!state)return;pending=true;[...$('#options').children].forEach(b=>b.disabled=true);try{await api('vote',{choice,round:state.round});}catch(e){$('#connection').textContent=e.message;}finally{pending=false;await refresh();}}
function drawTime(){if(!state)return;const left=Math.max(0,Math.ceil((state.deadline-Date.now()-offset)/1000));$('#time').textContent=state.phase==='revealed'?'✓':left; if(!left)[...$('#options').children].forEach(b=>b.disabled=true);}
$('#join-form').onsubmit=async e=>{e.preventDefault();const button=$('#join-form button');button.disabled=true;try{const name=await window.classroomIdentity.ready;session=await api('join',{room:$('#room').value,name});localStorage.setItem('guild-player-'+session.room,JSON.stringify(session));history.replaceState(null,'','?room='+session.room);joined();await refresh();}catch(error){$('#join-error').textContent=error.message;session=null;}finally{button.disabled=false;}};
if(session&&session.name){joined();refresh();}else{session=null;}setInterval(()=>{if(document.visibilityState==='visible'&&session&&(!state||state.phase!=='ended'))refresh();},3000);setInterval(drawTime,250);
})();
</script></body></html>
